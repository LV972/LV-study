<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Classeur de révision</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Concept : un vrai site. Barre du haut (marque, recherche, thème), bandeau d'accueil en dégradé bleu-vert, cartes de matières teintées par leur couleur, fiches en grille, feuille d'écriture au centre. */
:root{
  color-scheme:light;
  --bg:#F4F7FC; --surface:#FFFFFF; --ink:#0E1A33; --muted:#5A6684; --line:#E0E6F1;
  --accent:#2563EB; --accent-ink:#FFFFFF; --accent2:#0E9F9A; --soft:#E7EEFC; --mark:#FFE27A;
  --hero-a:#1D4ED8; --hero-b:#0E9F9A; --hero-ink:#FFFFFF;
  --good:#0F7A4A; --good-bg:#DCF4E7; --bad:#B3261E; --bad-bg:#FCE2DF;
  --shadow:0 1px 2px rgba(14,26,51,.05),0 10px 28px rgba(14,26,51,.07);
  --shadow-lg:0 2px 4px rgba(14,26,51,.06),0 18px 44px rgba(14,26,51,.12);
  --display:'Bricolage Grotesque',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0A1022; --surface:#121A31; --ink:#EAF0FF; --muted:#95A1BF; --line:#232D4A;
    --accent:#6C9BFF; --accent-ink:#07101F; --accent2:#2DD4BF; --soft:#1B2646;
    --hero-a:#1E3A8A; --hero-b:#0F766E;
    --good:#5AD39A; --good-bg:#10352A; --bad:#FF918A; --bad-bg:#3C1B1E;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
    --shadow-lg:0 2px 4px rgba(0,0,0,.5),0 18px 44px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0A1022; --surface:#121A31; --ink:#EAF0FF; --muted:#95A1BF; --line:#232D4A;
  --accent:#6C9BFF; --accent-ink:#07101F; --accent2:#2DD4BF; --soft:#1B2646;
  --hero-a:#1E3A8A; --hero-b:#0F766E;
  --good:#5AD39A; --good-bg:#10352A; --bad:#FF918A; --bad-bg:#3C1B1E;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  --shadow-lg:0 2px 4px rgba(0,0,0,.5),0 18px 44px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.55;
  padding-block:16px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shell{max-width:1180px;margin:0 auto}
svg{flex:0 0 auto}

/* barre du haut */
.top{display:flex;align-items:center;gap:14px;margin-bottom:22px;padding:10px 12px 10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:10px;border:0;background:transparent;cursor:pointer;padding:0;text-align:left}
.logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--hero-a),var(--hero-b));display:grid;place-items:center;color:#fff}
.bname{font-family:var(--display);font-weight:800;font-size:1.25rem;letter-spacing:-.02em;line-height:1}
.searchbox{flex:1 1 auto;display:flex;align-items:center;gap:8px;min-height:42px;padding:0 14px;border-radius:12px;background:var(--bg);border:1px solid var(--line);max-width:520px;margin-inline:auto;color:var(--muted)}
.searchbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.searchbox input{flex:1;min-width:0;border:0;background:transparent;outline:none;color:var(--ink)}
.iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center}
.iconbtn:hover{border-color:var(--accent)}
@media (max-width:640px){
  .top{flex-wrap:wrap}
  .searchbox{order:3;flex:1 1 100%;max-width:none}
  .brand{margin-right:auto}
}

.app{display:grid;grid-template-columns:250px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:860px){.app{grid-template-columns:minmax(0,1fr);gap:16px}}

/* boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:.93rem;white-space:nowrap;transition:transform .12s,border-color .12s,filter .12s}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 55%,var(--line))}
.btn.light{background:#fff;color:#0E1A33;border-color:#fff}
.btn.outline-w{background:transparent;color:#fff;border-color:rgba(255,255,255,.55)}
.btn.sm{min-height:36px;padding:0 12px;font-size:.86rem;border-radius:10px}

/* matières (colonne) */
.side{position:sticky;top:calc(12px + env(safe-area-inset-top,0px));background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
@media (max-width:860px){.side{position:static}}
.side h2{font-family:var(--display);font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:2px 4px 10px;font-weight:700}
.subjects{display:flex;flex-direction:column;gap:2px}
@media (max-width:860px){.subjects{flex-direction:row;overflow-x:auto;padding-bottom:6px;gap:6px}}
.tab{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 10px;border-radius:10px;border:1px solid transparent;background:transparent;cursor:pointer;text-align:left;width:100%;font-weight:500}
@media (max-width:860px){.tab{width:auto;flex:0 0 auto;border-color:var(--line)}}
.tab:hover{background:var(--soft)}
.tab[aria-current="true"]{background:color-mix(in srgb,var(--c) 14%,var(--surface));border-color:color-mix(in srgb,var(--c) 40%,var(--line));font-weight:600}
.ini{width:28px;height:28px;border-radius:8px;background:var(--c);color:var(--ci,#fff);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:.9rem;flex:0 0 auto}
.tab .tn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab .n{margin-left:auto;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.addform{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
@media (max-width:860px){.addform{flex-direction:row;flex-wrap:wrap;align-items:center}}
.addform label.lb{font-size:.82rem;color:var(--muted);font-weight:600}
.field{min-height:42px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);width:100%;min-width:0}
.field:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches input{position:absolute;opacity:0;width:0;height:0}
.swatches label{display:block;width:26px;height:26px;border-radius:50%;background:var(--c);cursor:pointer;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.swatches input:checked+label{box-shadow:0 0 0 2px var(--ink)}
.swatches input:focus-visible+label{outline:2px solid var(--accent);outline-offset:3px}

/* contenu */
.main{min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:var(--shadow)}
@media (max-width:520px){.panel{padding:16px}}
h1,h2,h3{text-wrap:balance}
.h1{font-family:var(--display);font-weight:800;font-size:2rem;letter-spacing:-.025em;line-height:1.1;margin:0}
.sub{color:var(--muted);margin:8px 0 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:18px}

/* accueil */
.hero{border-radius:20px;padding:34px;color:var(--hero-ink);background:
  radial-gradient(900px 300px at 100% 0%,rgba(255,255,255,.18),transparent 60%),
  linear-gradient(135deg,var(--hero-a),var(--hero-b));box-shadow:var(--shadow-lg);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:28px 28px;mask-image:linear-gradient(90deg,transparent 35%,#000);-webkit-mask-image:linear-gradient(90deg,transparent 35%,#000);pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero h2{font-family:var(--display);font-weight:800;font-size:clamp(1.9rem,4.2vw,2.9rem);letter-spacing:-.03em;line-height:1.04;margin:0;max-width:16ch}
.hero p{margin:14px 0 0;max-width:46ch;font-size:1.05rem;opacity:.95}
.hero .row{margin-top:22px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.chip{padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.18);font-size:.85rem;font-weight:600}
@media (max-width:520px){.hero{padding:22px}}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 12px}
.sechead h3{font-family:var(--display);font-size:1.25rem;font-weight:700;margin:0;letter-spacing:-.01em}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.tile{display:flex;flex-direction:column;gap:12px;align-items:flex-start;text-align:left;padding:18px;border-radius:16px;cursor:pointer;background:color-mix(in srgb,var(--c) 11%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 28%,var(--line));transition:transform .15s,box-shadow .15s}
.tile:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.tile .ini{width:44px;height:44px;border-radius:13px;font-size:1.3rem}
.tile .tn{font-family:var(--display);font-weight:700;font-size:1.15rem;letter-spacing:-.01em;overflow-wrap:anywhere}
.tile .tc{color:var(--muted);font-size:.88rem}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;counter-reset:s}
.step{padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--bg)}
.step::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:700;margin-bottom:10px}
.step b{display:block;font-family:var(--display);font-size:1.05rem;margin-bottom:4px}
.step span{color:var(--muted);font-size:.93rem}
.empty{padding:34px 12px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
.empty .btns{margin-top:14px;justify-content:center}

/* matière */
.banner{border-radius:20px;padding:24px;margin-bottom:20px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 22%,var(--surface)),color-mix(in srgb,var(--c) 6%,var(--surface)));border:1px solid color-mix(in srgb,var(--c) 32%,var(--line))}
.banner .top2{display:flex;gap:14px;align-items:center;margin-bottom:6px}
.banner .ini{width:52px;height:52px;border-radius:15px;font-size:1.5rem}
.title-input{font-family:var(--display);font-weight:800;font-size:2rem;letter-spacing:-.025em;line-height:1.15;background:transparent;border:1px solid transparent;border-radius:10px;padding:2px 8px;margin-left:-8px;width:100%;min-width:0}
.title-input:hover,.title-input:focus{border-color:var(--line);background:var(--surface);outline:none}
.title-input:focus{border-color:var(--accent)}
.banner .row{margin-top:16px}
.filters{display:flex;gap:6px;margin:0 0 16px;flex-wrap:wrap}
.pill{min-height:36px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:.9rem}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.dcard{display:flex;flex-direction:column;gap:8px;padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--surface);cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s;min-width:0}
.dcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--accent)}
.dcard h3{font-family:var(--display);font-size:1.12rem;font-weight:700;margin:0;letter-spacing:-.01em;overflow-wrap:anywhere}
.dcard .snip{margin:0;color:var(--muted);font-size:.92rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:3em;overflow-wrap:anywhere}
.dtop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:auto;padding-top:8px;flex-wrap:wrap}
.dfoot .m{font-size:.82rem;color:var(--muted)}
.badge{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--ink)}
.badge.fiche{background:var(--accent);color:var(--accent-ink)}
.ring{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;position:relative;background:conic-gradient(var(--accent2) calc(var(--p)*1%),var(--soft) 0)}
.ring::before{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--surface)}
.ring b{position:relative;font-size:.68rem;font-variant-numeric:tabular-nums}
.confirm{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 14px;border:1px solid var(--bad);border-radius:12px;background:var(--bad-bg);margin-bottom:16px}
.confirm span{flex:1 1 220px}

/* document */
.docbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:14px}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 12px;padding:8px;border:1px solid var(--line);border-radius:14px;background:var(--surface);position:sticky;top:calc(8px + env(safe-area-inset-top,0px));z-index:5;box-shadow:var(--shadow)}
.toolbar .btn{min-width:40px;padding:0 10px;border-color:transparent;background:transparent}
.toolbar .btn:hover{background:var(--soft)}
.toolbar .sep{width:1px;background:var(--line);margin:4px 2px}
.editor{min-height:340px;padding:26px;border:1px solid var(--line);border-radius:14px;background:var(--bg);font-size:1.06rem;line-height:1.75;overflow-wrap:anywhere}
@media (max-width:520px){.editor{padding:16px}}
.editor:focus{outline:2px solid var(--accent);outline-offset:1px}
.editor:empty::before{content:attr(data-ph);color:var(--muted)}
.editor h3{font-family:var(--display);font-size:1.35rem;font-weight:700;margin:1em 0 .3em;letter-spacing:-.01em}
.editor p{margin:0 0 .8em}
.editor ul,.editor ol{padding-left:1.4em;margin:0 0 .8em}
.editor [style*="255, 226, 122"],.editor [style*="ffe27a"],.editor mark{color:#0E1A33;background:var(--mark);border-radius:3px}
.hint{font-size:.88rem;color:var(--muted);margin:10px 0 0}
.files{margin-top:28px;padding-top:22px;border-top:1px solid var(--line)}
.files h3{font-family:var(--display);font-size:1.15rem;margin:0 0 12px}
.file{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:10px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--bg)}
.file .nm{overflow-wrap:anywhere;min-width:0;flex:1 1 180px}
.file .fst{display:block;font-size:.84rem;margin-top:2px}
.file .fst.ok{color:var(--accent)}
.upload{display:inline-flex}
.upload input{position:absolute;opacity:0;width:0;height:0}
.upload input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.viewer{margin-top:14px;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--bg)}
.vbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.pages{display:flex;flex-direction:column;gap:10px;max-height:70vh;overflow:auto}
.pages canvas{background:#fff;border-radius:6px}
.vimg{max-width:100%;height:auto;border-radius:6px;display:block}

/* QCM */
.qwrap{max-width:760px;margin-inline:auto}
.qhead{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;font-weight:600;color:var(--muted);font-size:.92rem}
.bar{height:10px;border-radius:999px;background:var(--soft);overflow:hidden;margin:12px 0 26px}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2));width:var(--w,0%);transition:width .3s}
.qtext{font-family:var(--display);font-weight:700;font-size:1.45rem;line-height:1.25;letter-spacing:-.015em;margin:0 0 20px;overflow-wrap:anywhere}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:14px;align-items:center;text-align:left;width:100%;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;min-height:56px;transition:transform .12s,border-color .12s}
.opt:hover:not([disabled]){border-color:var(--accent);transform:translateX(3px)}
.opt .k{flex:0 0 auto;width:32px;height:32px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:700;font-size:.88rem}
.opt .x{min-width:0;overflow-wrap:anywhere}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.ok .k{background:var(--good);color:var(--surface)}
.opt.ko{border-color:var(--bad);background:var(--bad-bg)}
.opt.ko .k{background:var(--bad);color:var(--surface)}
.opt[disabled]{cursor:default}
.note{margin-top:16px;padding:14px 16px;border-radius:14px;background:var(--soft);font-size:.95rem;animation:rise .25s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.verdict{font-family:var(--display);font-weight:700;font-size:1.1rem;margin-bottom:4px}
.verdict.ok{color:var(--good)} .verdict.ko{color:var(--bad)}
.score{font-family:var(--display);font-weight:800;font-size:4rem;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.miss{margin:18px 0;display:flex;flex-direction:column;gap:10px}
.miss div{padding:12px 14px;border:1px solid var(--line);border-radius:12px;overflow-wrap:anywhere}
.miss small{color:var(--muted);display:block;margin-top:4px;font-size:.9rem}
.counts{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 0}
.help{margin-top:14px;padding:16px;border:1px dashed var(--line);border-radius:14px;font-size:.95rem}
.help code{background:var(--soft);padding:1px 6px;border-radius:5px;font-size:.9em}

/* recherche */
.res{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.rcard{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1px solid var(--line);border-radius:14px;cursor:pointer;background:var(--surface)}
.rcard:hover{border-color:var(--accent)}
.rcard .snip{color:var(--muted);font-size:.9rem;margin:2px 0 0;overflow-wrap:anywhere}

/* sauvegarde */
textarea.field{padding:10px 12px;min-height:110px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:.92rem;box-shadow:var(--shadow-lg);z-index:40;max-width:calc(100vw - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* profils */
.profil-btn{gap:8px;font-weight:700}
.profil-btn .pdot{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--hero-a),var(--hero-b));color:#fff;display:grid;place-items:center;font-size:.68rem;font-weight:800;letter-spacing:.02em}
#profil-screen{position:fixed;inset:0;z-index:60;background:var(--bg);display:grid;place-items:center;padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));overflow:auto}
.pbox{width:100%;max-width:560px;text-align:center}
.pbox .logo{margin:0 auto 18px;width:56px;height:56px;border-radius:17px}
.pbox h1{font-family:var(--display);font-size:clamp(1.6rem,5vw,2.1rem);letter-spacing:-.02em;margin:0 0 6px}
.pbox p{color:var(--muted);margin:0 0 26px}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.pcard{display:flex;flex-direction:column;align-items:center;gap:12px;padding:26px 10px;border-radius:18px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);cursor:pointer;font-weight:700;transition:transform .12s,border-color .12s}
.pcard:hover{border-color:var(--accent);transform:translateY(-2px)}
.pcard .pbig{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-size:1.35rem;font-weight:800;background:linear-gradient(135deg,var(--hero-a),var(--hero-b))}
.pcard.cur{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.pcard .pcap{font-size:.8rem;font-weight:500;color:var(--muted)}
@media (max-width:420px){.pgrid{gap:8px}.pcard{padding:20px 6px}.pcard .pbig{width:52px;height:52px}}
</style>

<link rel="prefetch" href="vendor/pdfjs/pdf.min.js" as="script">

</head>
<body>
<div class="shell">
  <header class="top">
    <button class="brand" type="button" data-action="home" aria-label="Accueil">
      <span class="logo"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/><path d="m10 8 1.6 1.6L14.5 6.7"/></svg></span>
      <span class="bname">Classeur</span>
    </button>
    <label class="searchbox"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="search" type="search" placeholder="Chercher dans tes cours et fiches" autocomplete="off" aria-label="Rechercher"></label>
    <button class="btn sm profil-btn" id="profil-btn" type="button" data-action="changer-profil" aria-label="Changer de profil" title="Changer de profil"><span class="pdot" id="profil-dot">?</span><span id="profil-name">Profil</span></button>
    <button class="iconbtn" id="theme-btn" type="button" data-action="theme" aria-label="Changer de thème"></button>
  </header>
  <div class="app">
    <aside class="side" id="side" aria-label="Matières"></aside>
    <main class="main" id="main"></main>
  </div>
</div>
<div id="profil-screen" role="dialog" aria-modal="true" aria-labelledby="profil-titre" hidden>
  <div class="pbox">
    <span class="logo"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/><path d="m10 8 1.6 1.6L14.5 6.7"/></svg></span>
    <h1 id="profil-titre">Qui est-ce ?</h1>
    <p>Choisis ton profil : tes fiches, cours, QCM et PDF sont séparés de ceux des autres.</p>
    <div class="pgrid" id="pgrid"></div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
'use strict';

/* ---------- utilitaires ---------- */
var $=function(s){return document.querySelector(s)};
var uid=function(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var COLORS=['#F4511E','#1E88E5','#00A86B','#D81B8A','#F2A900','#7C4DFF'];
var KEY='classeur-revision-v1';
var LEGACY_KEY='classeur-revision-v1';
var toastTimer=null;
function toast(msg){var t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.hidden=true},3400)}
function fmtDate(ts){try{return new Date(ts).toLocaleDateString('fr-FR',{day:'numeric',month:'short'})}catch(e){return ''}}
function sty(c){return '--c:'+c+';--ci:'+(c==='#F2A900'?'#1A1300':'#fff')}
var IC={
  plus:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  play:'<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
  back:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg>',
  sun:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  moon:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>'
};

function sanitize(html){
  var d=new DOMParser().parseFromString('<body>'+html,'text/html');
  d.body.querySelectorAll('script,style,iframe,object,embed,link,meta,form,input,button,svg,math,base,img,video,audio,source,textarea,select').forEach(function(e){e.remove()});
  d.body.querySelectorAll('*').forEach(function(e){
    Array.prototype.slice.call(e.attributes).forEach(function(a){
      var n=a.name.toLowerCase();
      if(n.indexOf('on')===0||((n==='href'||n==='src'||n==='formaction'||n==='xlink:href')&&/^\s*javascript:/i.test(a.value))) e.removeAttribute(a.name);
    });
  });
  return d.body.innerHTML;
}
var tmp=document.createElement('div');
function plain(h){
  tmp.innerHTML=sanitize(h||'');
  tmp.querySelectorAll('p,li,div,h3,br').forEach(function(e){e.insertAdjacentText('afterend',' ')});
  return (tmp.textContent||'').replace(/ /g,' ').replace(/\s+/g,' ').trim();
}

/* ---------- données ---------- */
var S={subjects:[],docs:[],seeded:false};
function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&Array.isArray(o.subjects)&&Array.isArray(o.docs))S=o}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("Impossible d'enregistrer dans ce navigateur (stockage bloqué).")}}
function seed(){
  if(S.seeded||S.subjects.length||S.docs.length)return;
  var sid=uid();
  S.subjects.push({id:sid,name:'SVT (exemple)',color:COLORS[2]});
  S.docs.push({id:uid(),sid:sid,type:'fiche',title:'La cellule (exemple)',updated:Date.now(),files:[],last:null,
    html:'<h3>La cellule</h3>'+
    '<p><b>Cellule</b> : unité structurale et fonctionnelle de tous les êtres vivants.</p>'+
    '<p>Le <b>noyau</b> contient l\'information génétique sous forme d\'ADN.</p>'+
    '<p><b>Mitochondrie</b> : organite qui produit l\'énergie de la cellule grâce à la respiration cellulaire.</p>'+
    '<p><b>Chloroplaste</b> : organite des cellules végétales qui réalise la photosynthèse.</p>'+
    '<p>La <b>membrane plasmique</b> délimite la cellule et contrôle les échanges avec l\'extérieur.</p>'+
    '<p><b>Ribosome</b> : petite structure qui fabrique les protéines à partir de l\'information de l\'ARN.</p>'+
    '<p>La <b>paroi</b> rigide entoure uniquement les cellules végétales et leur donne de la solidité.</p>'});
  S.seeded=true;save();
}
var getSubject=function(id){return S.subjects.find(function(s){return s.id===id})};
var getDoc=function(id){return S.docs.find(function(d){return d.id===id})};

/* fichiers (PDF, images) dans IndexedDB */
var dbp=null;
function idb(){
  if(!dbp)dbp=new Promise(function(res,rej){
    try{var r=indexedDB.open('classeur-fichiers',1);r.onupgradeneeded=function(){r.result.createObjectStore('files')};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}}catch(e){rej(e)}
  });
  return dbp;
}
function fput(id,blob){return idb().then(function(d){return new Promise(function(res,rej){var t=d.transaction('files','readwrite');t.objectStore('files').put(blob,id);t.oncomplete=res;t.onerror=function(){rej(t.error)}})})}
function fget(id){return idb().then(function(d){return new Promise(function(res,rej){var q=d.transaction('files').objectStore('files').get(id);q.onsuccess=function(){res(q.result)};q.onerror=function(){rej(q.error)}})})}
function fdel(id){return idb().then(function(d){return new Promise(function(res){var t=d.transaction('files','readwrite');var st=t.objectStore('files');st.delete(id);st.delete('txt:'+id);t.oncomplete=res;t.onerror=res})}).catch(function(){})}

/* ---------- thème ---------- */
var theme=null;try{theme=localStorage.getItem('classeur-theme')}catch(e){}
function isDark(){return theme?theme==='dark':window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches}
function applyTheme(){
  if(theme)document.documentElement.setAttribute('data-theme',theme);else document.documentElement.removeAttribute('data-theme');
  var b=$('#theme-btn');b.innerHTML=isDark()?IC.sun:IC.moon;b.title=isDark()?'Passer en mode clair':'Passer en mode sombre';
}

/* ---------- navigation ---------- */
var nav={view:'home',sid:null,docId:null,filter:'all'};
var ui={confirm:null,quiz:null,avail:0,stats:null,viewTok:0,viewUrl:null,q:'',prev:null,reading:{}};
function go(view,p){
  nav=Object.assign({},nav,{view:view},p||{});ui.confirm=null;
  var sb=$('#search');if(sb&&sb.value){sb.value='';ui.q=''}
  render();try{window.scrollTo(0,0)}catch(e){}
}

/* ---------- rendu ---------- */
function renderSide(){
  var h='<h2>Matières</h2><nav class="subjects">';
  S.subjects.forEach(function(s){
    var n=S.docs.filter(function(d){return d.sid===s.id}).length;
    h+='<button class="tab" type="button" data-action="open-subject" data-id="'+s.id+'" style="'+sty(s.color)+'" aria-current="'+(nav.sid===s.id&&(nav.view==='subject'||nav.view==='doc'||nav.view==='quizsetup'||nav.view==='quiz'))+'"><span class="ini">'+esc(s.name.trim().charAt(0).toUpperCase())+'</span><span class="tn">'+esc(s.name)+'</span><span class="n">'+n+'</span></button>';
  });
  if(!S.subjects.length)h+='<p class="muted" style="margin:6px 4px;font-size:.92rem">Aucune matière pour l\'instant.</p>';
  h+='</nav><form class="addform" id="subj-form"><label for="subj-name" class="lb">Ajouter une matière</label>'+
    '<input class="field" id="subj-name" type="text" maxlength="40" placeholder="Maths, Histoire, Anglais…" autocomplete="off">'+
    '<div class="swatches" role="radiogroup" aria-label="Couleur de la matière">';
  COLORS.forEach(function(c,i){h+='<span><input type="radio" name="subj-color" id="sc'+i+'" value="'+c+'"'+(i===0?' checked':'')+'><label for="sc'+i+'" style="--c:'+c+'" title="Couleur '+(i+1)+'"></label></span>'});
  h+='</div><button class="btn primary" type="submit">'+IC.plus+'Ajouter</button></form>';
  $('#side').innerHTML=h;
}

function viewHome(){
  var nd=S.docs.length,nf=S.docs.filter(function(d){return d.type==='fiche'}).length;
  var ex=S.docs.filter(function(d){return /\(exemple\)/.test(d.title)})[0];
  var h='<div class="stack"><section class="hero"><h2>Tes cours, tes fiches, tes QCM.</h2><p>Range chaque matière, écris tes fiches, puis teste-toi : les questions sont fabriquées à partir de ce que tu as écrit.</p>'+
    '<div class="row"><button class="btn light" type="button" data-action="focus-add">'+IC.plus+'Ajouter une matière</button>'+
    (ex?'<button class="btn outline-w" type="button" data-action="quiz-setup" data-id="'+ex.id+'">'+IC.play+'Essayer un QCM</button>':'')+'</div>'+
    '<div class="chips"><span class="chip">'+S.subjects.length+' matière'+(S.subjects.length>1?'s':'')+'</span><span class="chip">'+nd+' document'+(nd>1?'s':'')+'</span><span class="chip">'+nf+' fiche'+(nf>1?'s':'')+'</span></div></section>';
  h+='<section class="panel"><div class="sechead"><h3>Tes matières</h3></div>';
  if(S.subjects.length){
    h+='<div class="tiles">';
    S.subjects.forEach(function(s){
      var c=S.docs.filter(function(d){return d.sid===s.id}).length;
      h+='<button class="tile" type="button" data-action="open-subject" data-id="'+s.id+'" style="'+sty(s.color)+'"><span class="ini">'+esc(s.name.trim().charAt(0).toUpperCase())+'</span><span class="tn">'+esc(s.name)+'</span><span class="tc">'+c+' document'+(c>1?'s':'')+'</span></button>';
    });
    h+='</div>';
  }else{
    h+='<div class="empty">Commence par ajouter une matière dans la colonne de gauche.</div>';
  }
  h+='</section><section class="panel"><div class="sechead"><h3>Comment ça marche</h3></div><div class="steps">'+
    '<div class="step"><b>Crée une matière</b><span>Maths, histoire, anglais… Choisis un nom et une couleur.</span></div>'+
    '<div class="step"><b>Écris ta fiche</b><span>Colle ton cours ou joins un PDF : le site le lit et te propose une fiche toute prête avec « Générer une fiche ». Relis-la et garde l\'essentiel.</span></div>'+
    '<div class="step"><b>Teste-toi</b><span>Le bouton QCM crée des questions à choix multiple à partir de ta fiche.</span></div></div></section>';
  h+='<section class="panel"><div class="sechead"><h3>Sauvegarde</h3></div><p class="muted" style="margin:0 0 12px">Tout est enregistré dans ce navigateur, sur cet appareil, pour le profil actif. Copie le texte ci-dessous pour garder une sauvegarde de tes cours et fiches (les PDF et images restent sur cet appareil).</p>'+
    '<textarea class="field" id="export-box" readonly aria-label="Sauvegarde de tes cours et fiches"></textarea>'+
    '<div class="row" style="margin-top:10px"><button class="btn" type="button" data-action="copy-export">Copier la sauvegarde</button></div>'+
    '<p class="muted" style="margin:18px 0 10px">Pour restaurer, colle une sauvegarde ici ou choisis le fichier. Les documents sont ajoutés à ceux que tu as déjà.</p>'+
    '<textarea class="field" id="import-box" aria-label="Coller une sauvegarde" placeholder="Colle ta sauvegarde ici"></textarea>'+
    '<div class="row" style="margin-top:10px"><button class="btn" type="button" data-action="import-text">Importer</button>'+
    '<label class="upload"><input type="file" id="import-file" accept=".json,application/json,text/plain"><span class="btn ghost">Choisir un fichier</span></label></div></section></div>';
  return h;
}

function docCard(d){
  var sn=plain(d.html);
  var h='<article class="dcard" data-action="open-doc" data-id="'+d.id+'" role="button" tabindex="0"><div class="dtop"><span class="badge '+d.type+'">'+(d.type==='fiche'?'Fiche':'Cours')+'</span>';
  if(d.last)h+='<span class="ring" style="--p:'+Math.round(100*d.last.score/Math.max(1,d.last.total))+'" title="Dernier QCM : '+d.last.score+' sur '+d.last.total+'"><b>'+d.last.score+'/'+d.last.total+'</b></span>';
  h+='</div><h3>'+esc(d.title||'Sans titre')+'</h3><p class="snip">'+(sn?esc(sn.slice(0,160)):'Document vide pour l\'instant.')+'</p>'+
    '<div class="dfoot"><span class="m">'+fmtDate(d.updated)+(d.files&&d.files.length?' · '+d.files.length+' fichier'+(d.files.length>1?'s':''):'')+'</span>'+
    '<button class="btn sm primary" type="button" data-action="quiz-setup" data-id="'+d.id+'">'+IC.play+'QCM</button></div></article>';
  return h;
}

function viewSubject(){
  var s=getSubject(nav.sid);if(!s)return viewHome();
  var all=S.docs.filter(function(d){return d.sid===s.id});
  var docs=all.filter(function(d){return nav.filter==='all'||d.type===nav.filter}).sort(function(a,b){return b.updated-a.updated});
  var nf=all.filter(function(d){return d.type==='fiche'}).length;
  var h='';
  if(ui.confirm==='subject'){
    h+='<div class="confirm"><span>Supprimer « '+esc(s.name)+' » et ses '+all.length+' document'+(all.length>1?'s':'')+' ? Cette action est définitive.</span><button class="btn danger sm" type="button" data-action="del-subject-yes">Oui, supprimer</button><button class="btn sm" type="button" data-action="cancel">Annuler</button></div>';
  }
  h+='<section class="banner" style="'+sty(s.color)+'"><div class="top2"><span class="ini">'+esc(s.name.trim().charAt(0).toUpperCase())+'</span>'+
    '<div style="flex:1;min-width:0"><input class="title-input" id="subj-title" type="text" value="'+esc(s.name)+'" maxlength="40" aria-label="Nom de la matière"></div></div>'+
    '<div class="muted" style="font-size:.95rem">'+all.length+' document'+(all.length>1?'s':'')+' · '+nf+' fiche'+(nf>1?'s':'')+'</div>'+
    '<div class="row"><button class="btn primary" type="button" data-action="new-doc" data-type="fiche">'+IC.plus+'Nouvelle fiche</button><button class="btn" type="button" data-action="new-doc" data-type="cours">'+IC.plus+'Nouveau cours</button><button class="btn ghost danger" type="button" data-action="del-subject-ask">Supprimer la matière</button></div></section>';
  h+='<div class="filters" role="group" aria-label="Filtrer">';
  [['all','Tout'],['fiche','Fiches'],['cours','Cours']].forEach(function(f){h+='<button class="pill" type="button" data-action="filter" data-f="'+f[0]+'" aria-pressed="'+(nav.filter===f[0])+'">'+f[1]+'</button>'});
  h+='</div>';
  if(!docs.length){
    h+='<div class="empty">'+(all.length?'Aucun document de ce type.':'Rien dans cette matière pour l\'instant.')+'<div class="row btns"><button class="btn primary" type="button" data-action="new-doc" data-type="fiche">Créer une fiche</button><button class="btn" type="button" data-action="new-doc" data-type="cours">Créer un cours</button></div></div>';
  }else{
    h+='<div class="grid">'+docs.map(docCard).join('')+'</div>';
  }
  return h;
}

function viewSearch(){
  var q=ui.q.toLowerCase(),res=[];
  S.docs.forEach(function(d){
    var p=plain(d.html),lt=(d.title||'').toLowerCase(),lp=p.toLowerCase(),i=lp.indexOf(q);
    if(lt.indexOf(q)>-1||i>-1){
      var sn=i>-1?('…'+p.slice(Math.max(0,i-40),i+110)+'…'):p.slice(0,120);
      res.push({d:d,sn:sn,t:lt.indexOf(q)>-1?0:1});
    }
  });
  res.sort(function(a,b){return a.t-b.t||b.d.updated-a.d.updated});
  var h='<section class="panel"><h2 class="h1" style="font-size:1.6rem">Résultats pour « '+esc(ui.q)+' »</h2><p class="sub">'+res.length+' document'+(res.length>1?'s':'')+' trouvé'+(res.length>1?'s':'')+'.</p>';
  if(!res.length)h+='<div class="empty" style="margin-top:16px">Rien ne correspond. Essaie un autre mot.</div>';
  else{
    h+='<div class="res">';
    res.slice(0,30).forEach(function(r){
      var s=getSubject(r.d.sid);
      h+='<div class="rcard" data-action="open-doc" data-id="'+r.d.id+'" role="button" tabindex="0"><span class="ini" style="'+sty(s?s.color:COLORS[0])+'">'+esc(s?s.name.trim().charAt(0).toUpperCase():'?')+'</span><div style="min-width:0"><b style="overflow-wrap:anywhere">'+esc(r.d.title||'Sans titre')+'</b> <span class="badge '+r.d.type+'">'+(r.d.type==='fiche'?'Fiche':'Cours')+'</span><div class="snip">'+esc(s?s.name+' · ':'')+esc(r.sn)+'</div></div></div>';
    });
    h+='</div>';
  }
  return h+'</section>';
}

function viewDoc(){
  var d=getDoc(nav.docId);if(!d)return viewHome();
  var s=getSubject(d.sid);
  var h='<div class="panel">';
  if(ui.confirm==='doc'){
    h+='<div class="confirm"><span>Supprimer « '+esc(d.title||'Sans titre')+' » ? Cette action est définitive.</span><button class="btn danger sm" type="button" data-action="del-doc-yes">Oui, supprimer</button><button class="btn sm" type="button" data-action="cancel">Annuler</button></div>';
  }
  h+='<div class="docbar"><button class="btn ghost sm" type="button" data-action="back">'+IC.back+esc(s?s.name:'Retour')+'</button>'+
    '<div class="row"><button class="btn primary" type="button" data-action="quiz-setup" data-id="'+d.id+'">'+IC.play+'Faire un QCM</button>'+
    (d.type==='cours'?'<button class="btn" type="button" data-action="to-fiche">Générer une fiche</button>':'')+
    '<button class="btn ghost danger" type="button" data-action="del-doc-ask">Supprimer</button></div></div>'+
    '<span class="badge '+d.type+'">'+(d.type==='fiche'?'Fiche':'Cours')+'</span>'+
    '<input class="title-input" id="doc-title" type="text" value="'+esc(d.title)+'" maxlength="120" aria-label="Titre" placeholder="Titre" style="margin-top:6px">'+
    '<div class="toolbar" role="toolbar" aria-label="Mise en forme">'+
    '<button class="btn sm" type="button" data-action="cmd" data-c="bold" title="Gras"><b>G</b></button>'+
    '<button class="btn sm" type="button" data-action="cmd" data-c="italic" title="Italique"><i>I</i></button>'+
    '<button class="btn sm" type="button" data-action="cmd" data-c="underline" title="Souligné"><u>S</u></button>'+
    '<button class="btn sm" type="button" data-action="cmd" data-c="hl" title="Surligner"><span style="background:var(--mark);color:#0E1A33;padding:0 6px;border-radius:4px">Surligner</span></button><span class="sep"></span>'+

  else if(c==='ol')ex('insertOrderedList');

/* lecteur PDF : copie locale de pdf.js (vendor/pdfjs), CDN en secours */
var PDFJS_BASES=['vendor/pdfjs/','https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/'];
var pdfp=null;
function loadScript(src){return new Promise(function(res,rej){var s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
function pdfLib(){
  if(!pdfp){
    var tryBase=function(i){
      if(i>=PDFJS_BASES.length)return Promise.reject(new Error('pdfjs'));
      return loadScript(PDFJS_BASES[i]+'pdf.min.js').then(function(){
        if(!window.pdfjsLib)throw new Error('pdfjs');
        pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS_BASES[i]+'pdf.worker.min.js';
        return pdfjsLib;
      }).catch(function(){return tryBase(i+1)});
    };
    pdfp=window.pdfjsLib?Promise.resolve(window.pdfjsLib):tryBase(0);
    pdfp.catch(function(){pdfp=null});
  }
  return pdfp;
}
function openPdf(blob){
  return Promise.all([pdfLib(),blob.arrayBuffer()]).then(function(r){return r[0].getDocument({data:new Uint8Array(r[1])}).promise});
}
function pdfError(e){
  if(e&&e.name==='PasswordException')return 'Ce PDF est protégé par un mot de passe.';
  if(e&&e.message==='pdfjs')return "Le lecteur de PDF n'a pas pu se charger. Recharge la page.";
  if(e&&e.message==='absent')return 'Ce fichier est introuvable sur cet appareil.';
  return 'Impossible de lire ce PDF.';
}
function isPdfMeta(f){return f.mime==='application/pdf'||/\.pdf$/i.test(f.name||'')}
function openFile(fid){
  var d=getDoc(nav.docId),f=d&&d.files.find(function(x){return x.id===fid});if(!f)return;

  var bar='<div class="vbar"><strong style="overflow-wrap:anywhere">'+esc(f.name)+'</strong><button class="btn sm" type="button" data-action="close-viewer">Fermer</button></div>';
  fget(fid).then(function(blob){
    if(tok!==ui.viewTok)return;
    if(!blob){box.innerHTML=bar+'<p>Ce fichier est introuvable sur cet appareil.</p>';return}
    if(!isPdfMeta(f)){
      ui.viewUrl=URL.createObjectURL(blob);
      box.innerHTML=bar+'<img class="vimg" src="'+ui.viewUrl+'" alt="'+esc(f.name)+'">';
      return;
    }
    return openPdf(blob).then(function(pdf){
      if(tok!==ui.viewTok)return;
      box.innerHTML=bar+'<div class="pages" id="pages"></div>';
      var pages=$('#pages'),w=pages.clientWidth||600,max=Math.min(pdf.numPages,30);
      var chain=Promise.resolve();
      for(var p=1;p<=max;p++){(function(p){
        chain=chain.then(function(){
          if(tok!==ui.viewTok)return;
          return pdf.getPage(p).then(function(page){
            var v1=page.getViewport({scale:1}),sc=Math.min(2,w/v1.width),dpr=window.devicePixelRatio||1;
            var v=page.getViewport({scale:sc*dpr}),c=document.createElement('canvas');
            c.width=v.width;c.height=v.height;c.style.width='100%';c.style.height='auto';
            pages.appendChild(c);
            return page.render({canvasContext:c.getContext('2d'),viewport:v}).promise;
          });
        });
      })(p)}
      return chain.then(function(){if(pdf.numPages>max&&tok===ui.viewTok){var n=document.createElement('p');n.className='muted';n.textContent='Aperçu limité aux '+max+' premières pages sur '+pdf.numPages+'.';pages.appendChild(n)}});
    });
  }).catch(function(e){if(tok===ui.viewTok)box.innerHTML=bar+'<p>'+esc(pdfError(e))+'</p>'});
}

/* lecture du texte : lignes (avec taille de police) puis blocs titre / paragraphe / puce */
function pageLines(tc){
  var out=[],line=null,lastX=null,lastY=null;
  function push(){if(line&&line.t.trim())out.push({t:line.t.replace(/\s+/g,' ').trim(),s:line.s});line=null;lastX=null}
  tc.items.forEach(function(it){
    if(typeof it.str!=='string'||!it.transform)return;
    var x=it.transform[4],y=it.transform[5],sz=Math.sqrt(it.transform[2]*it.transform[2]+it.transform[3]*it.transform[3])||it.height||10;
    if(line&&lastY!==null&&Math.abs(y-lastY)>Math.max(2,sz*0.5))push();
    if(it.str){
      if(!line)line={t:'',s:0};
      if(line.t&&lastX!==null&&x-lastX>sz*0.2&&!/\s$/.test(line.t)&&!/^\s/.test(it.str))line.t+=' ';
      line.t+=it.str;
      if(it.str.trim())line.s=Math.max(line.s,Math.round(sz*10)/10);
      lastX=x+(it.width||0);lastY=y;
    }
    if(it.hasEOL)push();
  });
  push();
  return out;
}
var BULLET=/^[•●▪◦■□➢►✓\-–—*]\s*/;
var NUMHEAD=/^((\d+(\.\d+)*|[IVX]{1,5}|[A-H])\s*[.)\-–]|chapitre\b|partie\b|section\b|leçon\b|th[èe]me\b)\s*/i;
function linesToBlocks(pages){
  var count={};
  pages.forEach(function(ls){var seen={};ls.forEach(function(l){var k=l.t.toLowerCase().replace(/\d+/g,'#');if(!seen[k]){seen[k]=1;count[k]=(count[k]||0)+1}})});
  var lines=[];
  pages.forEach(function(ls){ls.forEach(function(l){
    var k=l.t.toLowerCase().replace(/\d+/g,'#');
    if(/^(page\s*)?#(\s*(\/|sur)\s*#)?$/.test(k))return; // numéros de page
    if(pages.length>=3&&count[k]>=Math.max(3,pages.length*0.5))return; // en-têtes et pieds de page répétés
    lines.push(l);
  })});
  var sizes={},tot=0;
  lines.forEach(function(l){sizes[l.s]=(sizes[l.s]||0)+l.t.length;tot+=l.t.length});
  var body=0,acc=0;
  Object.keys(sizes).map(Number).sort(function(a,b){return a-b}).forEach(function(s){if(acc<tot/2){acc+=sizes[s];body=s}});
  var blocks=[],cur=null;
  function flush(){if(cur){blocks.push(cur);cur=null}}
  lines.forEach(function(l){
    var t=l.t,short=t.length<=90&&!/[.,;]$/.test(t)&&/\p{L}/u.test(t);
    var head=short&&((body&&l.s>=body*1.18)||(NUMHEAD.test(t)&&t.length<=80&&t.split(' ').length<=12));
    if(head){flush();blocks.push({k:'h',t:t});return}
    if(BULLET.test(t)&&t.replace(BULLET,'').length>1){flush();cur={k:'li',t:t.replace(BULLET,'')};return}
    if(cur&&/-$/.test(cur.t)&&/^\p{Ll}/u.test(t)){cur.t=cur.t.slice(0,-1)+t;return}
    if(cur&&!/[.!?:;]$/.test(cur.t)){cur.t+=' '+t;return}
    flush();cur={k:'p',t:t};
  });
  flush();
  return blocks;
}
function readPdf(fid){
  return fget('txt:'+fid).catch(function(){return null}).then(function(c){
    if(c&&c.v===2&&Array.isArray(c.blocks))return c;
    return fget(fid).then(function(blob){
      if(!blob)throw new Error('absent');
      return openPdf(blob);
    }).then(function(pdf){
      var pages=[],chain=Promise.resolve(),max=Math.min(pdf.numPages,300);
      for(var p=1;p<=max;p++){(function(p){
        chain=chain.then(function(){return pdf.getPage(p)}).then(function(page){return page.getTextContent()}).then(function(tc){pages.push(pageLines(tc))});
      })(p)}
      return chain.then(function(){
        var blocks=linesToBlocks(pages),txt=blocks.map(function(b){return b.t}).join(' ');
        var words=(txt.match(/\p{L}+/gu)||[]).length;
        var r={v:2,pages:pdf.numPages,words:words<15?0:words,blocks:words<15?[]:blocks};
        return fput('txt:'+fid,r).catch(function(){}).then(function(){return r});
      });
    });
  });
}
function markRead(fid,r){
  S.docs.forEach(function(d){d.files.forEach(function(f){if(f.id===fid)f.read={pages:r.pages,words:r.words}})});
  save();
}
function readFile(fid){
  ui.reading[fid]=1;refreshFiles();
  return readPdf(fid).then(function(r){delete ui.reading[fid];markRead(fid,r);refreshFiles();return r},
    function(e){delete ui.reading[fid];refreshFiles();throw e});
}
function readMissing(d){
  var chain=Promise.resolve();
  d.files.filter(function(f){return isPdfMeta(f)&&!f.read}).forEach(function(f){
    chain=chain.then(function(){return readFile(f.id)}).catch(function(){});
  });
}
function blocksHtml(blocks){
  var h='',inList=false;
  blocks.forEach(function(b){
    if(b.k==='li'&&!inList){h+='<ul>';inList=true}
    if(b.k!=='li'&&inList){h+='</ul>';inList=false}
    h+=b.k==='h'?'<h3>'+esc(b.t)+'</h3>':b.k==='li'?'<li>'+esc(b.t)+'</li>':'<p>'+esc(b.t)+'</p>';
  });
  return h+(inList?'</ul>':'');
}
function extractPdf(fid){
  var d=getDoc(nav.docId),f=d&&d.files.find(function(x){return x.id===fid});if(!f)return;
  toast('Lecture du PDF…');

    var ed=$('#editor');if(!ed||nav.docId!==d.id)return;

    ed.dispatchEvent(new Event('input'));
    toast('Texte ajouté à la fin du document. Relis-le et mets les notions importantes en gras.');
  }).catch(function(e){toast(pdfError(e))});
}
function genFromPdf(fid){

    var g=makeFiche(r.blocks,[]);
    if(!g){toast("Le texte de ce PDF est trop court pour en tirer une fiche.");return}

    newFiche(d.sid,title,g);
  }).catch(function(e){toast(pdfError(e))});
}

function addFiles(list){
  var d=getDoc(nav.docId);if(!d)return;
  var arr=Array.prototype.slice.call(list),chain=Promise.resolve();
  arr.forEach(function(file){
    chain=chain.then(function(){

var PRONOUN=/^(il|elle|ils|elles|on|ce|c'|c’|cela|ceci|ça|qui|que|celui|celle|ceux|tout|cette|cet|ces|son|sa|ses|leur|leurs|nous|vous|je|tu|y|en|là|ici|elle-même|il\s.*)$/i;
var STRONG=/(^|[^\p{L}])(important|importante|importants|essentiel|essentielle|essentiels|retenir|fondamental|fondamentale|à savoir|attention|retiens)(?![\p{L}])/iu;
var CUE=/(^|[^\p{L}])(principal|principale|principe|loi|théorème|propriété|règle|formule|conclusion|en résumé|caractéristique|caractérise|rôle|cause|causes|conséquence|conséquences|permet|permettent|définition|objectif|but|étape|étapes)(?![\p{L}])/iu;
var CONNECT=/^(ainsi|en effet|par ailleurs|de plus|en outre|d'autre part|d’autre part|cependant|toutefois|enfin|or|donc|alors|aussi|bref|en fait|en conclusion|pour conclure)\s*,\s*/i;
function defOf(s){
  var m=s.match(/^([^:：]{2,60}?)\s*[:：]\s+(.{10,})$/);
  if(m&&m[1].split(' ').length<=6)return {term:m[1],def:m[2]};
  m=s.match(/^on (?:appelle|nomme|désigne par|définit)\s+(.{2,})$/i);
  if(m){
    // « On appelle X le/la/un… Y » : X s'arrête au premier déterminant qui ne suit pas une préposition
    var re=/,?\s+(le|la|les|l'|l’|un|une|tout|toute|ce|cette|cet)(?=[\s'’])\s?/gi,r;
    while((r=re.exec(m[1]))){
      var term=m[1].slice(0,r.index),def=m[1].slice(r.index).replace(/^,?\s+/,'');
      if(/(^|\s)(de|du|des|d'|d’|à|au|aux|et|ou|en|par|pour|sur)$/i.test(term)||term.length<2)continue;
      if(term.split(' ').length<=9&&def.length>=12)return {term:term,def:def};
      break;
    }
  }
  m=s.match(/^(?:l'|l’|le |la |les |un |une )?(.{2,45}?)\s+(?:est|sont)\s+((?:un|une|des|le|la|les|l'|l’|ce|cette)\s?.{10,})$/i)||
    s.match(/^(?:l'|l’|le |la |les |un |une )?(.{2,45}?)\s+(?:désigne|désignent|correspond à|correspondent à|se définit comme|se définissent comme|consiste à|consistent à|signifie)\s+(.{10,})$/i);
  if(m&&m[1].split(' ').length<=4&&m[1].indexOf(',')<0&&!PRONOUN.test(m[1].trim())&&!/\s(en|y|ne|n'|n’|se|s'|s’|lui|aussi|donc|également|alors|ainsi|souvent|toujours|aujourd'hui|aujourd’hui|qui|que)$/i.test(m[1].trim()))return {term:m[1],def:m[2]};
  return null;
}
function boldTerms(text,terms){
  var lc=text.toLowerCase(),spans=[];
  terms.forEach(function(t){
    if(spans.length>=2)return;
    var re=new RegExp('(^|[^\\p{L}])('+reEsc(t)+')(?![\\p{L}])','iu'),m=re.exec(text);
    if(!m)return;
    var a=m.index+m[1].length,b=a+m[2].length;
    if(spans.some(function(x){return a<x[1]&&b>x[0]}))return;
    spans.push([a,b]);
  });
  spans.sort(function(x,y){return x[0]-y[0]});
  var h='',pos=0;
  spans.forEach(function(x){h+=esc(text.slice(pos,x[0]))+'<b>'+esc(text.slice(x[0],x[1]))+'</b>';pos=x[1]});
  return h+esc(text.slice(pos));
}
function makeFiche(blocks,keys){
  var secs=[],sec={title:'',items:[]};
  blocks.forEach(function(b){
    if(b.k==='h'){
      if(!sec.items.length&&sec.title&&(sec.title+' · '+b.t).length<=90)sec.title+=' · '+b.t;
      else{if(sec.items.length||sec.title)secs.push(sec);sec={title:b.t,items:[]}}
    }else sec.items.push(b);
  });
  secs.push(sec);
  secs=secs.filter(function(s){return s.items.length});
  if(!secs.length)return null;
  // fréquence des mots dans tout le cours
  var freq={};
  blocks.forEach(function(b){(b.t.match(/[\p{L}'’-]{5,}/gu)||[]).forEach(function(w){var k=w.toLowerCase().replace(/^[ld]['’]/,'');if(k.length>=5&&!STOP[k])freq[k]=(freq[k]||0)+1})});
  var defs=[],seenD={};
  var parsed=secs.map(function(s){
    var cands=[];
    s.items.forEach(function(b){
      var ss=b.k==='li'?[b.t]:sentencesOf(b.t);
      ss.forEach(function(x,i){
        x=cleanLine(x);
        var d=defOf(x);
        if(d){
          var term=trail(cleanLine(d.term)),bare=term.replace(/^(?:(?:les|le|la|un|une|des)\s+|l['’]\s*)/i,'');
          if(bare.length>=2)term=bare;
          term=cap(term);var k=term.toLowerCase();
          if(term.length>=2&&!seenD[k]){seenD[k]=1;defs.push(term);cands.push({def:1,term:term,text:cap(trail(d.def)),order:cands.length})}
          return;
        }
        if(x.length<25&&b.k!=='li')return;
        if(x.length>300)return;
        var ws=(x.match(/[\p{L}'’-]{5,}/gu)||[]).map(function(w){return w.toLowerCase().replace(/^[ld]['’]/,'')}),sc=0;
        ws.forEach(function(w){if(freq[w]>=2&&!STOP[w])sc+=Math.log(freq[w])});
        sc=sc/Math.sqrt(Math.max(ws.length,4));
        if(STRONG.test(x))sc+=4;else if(CUE.test(x))sc+=2;
        if(/\b(1[0-9]{3}|20[0-9]{2})\b/.test(x)||/[=%]|\d/.test(x))sc+=1.5;
        if(i===0)sc+=1;
        if(b.k==='li')sc+=1.5;
        if(keys.some(function(k){return x.toLowerCase().indexOf(k.toLowerCase())>-1}))sc+=2;
        if(/^(par exemple|exemple|ex\s?:|voir|cf\.?|source|document|figure|fig\.?|tableau)\b/i.test(x))sc-=3;
        if(/\?$/.test(x))sc-=2;
        cands.push({text:cap(x.replace(CONNECT,'')),score:sc,order:cands.length});
      });
    });
    return {title:s.title,cands:cands};
  });
  // termes à mettre en gras : mots en gras du cours, notions définies, mots les plus fréquents
  var top=Object.keys(freq).filter(function(w){return freq[w]>=3&&!/['’]/.test(w)}).sort(function(a,b){return freq[b]-freq[a]}).slice(0,10);
  var terms=[];
  keys.concat(defs,top).forEach(function(t){t=trail(t);if(t.length>=3&&terms.map(function(x){return x.toLowerCase()}).indexOf(t.toLowerCase())<0)terms.push(t)});
  terms.sort(function(a,b){return b.length-a.length});
  var h='',nd=0,np=0;
  parsed.forEach(function(s,si){
    var ds=s.cands.filter(function(c){return c.def}).slice(0,10);
    var ps=s.cands.filter(function(c){return !c.def});
    var n=Math.max(ps.length?1:0,Math.min(6,Math.ceil(ps.length*0.4)));
    var keep=ps.slice().sort(function(a,b){return b.score-a.score}).slice(0,n);
    var avg=ps.reduce(function(a,c){return a+c.score},0)/(ps.length||1);
    keep=keep.filter(function(c,i){return i===0||c.score>=avg*0.8}).sort(function(a,b){return a.order-b.order});
    if(!ds.length&&!keep.length)return;
    var title=s.title||(parsed.length>1&&si===0?'Introduction':'L\'essentiel');
    h+='<h3>'+esc(title)+'</h3><ul>';
    ds.forEach(function(c){h+='<li><b>'+esc(c.term)+'</b> : '+esc(c.text)+'</li>';nd++});
    keep.forEach(function(c){h+='<li>'+boldTerms(c.text,terms)+'</li>';np++});
    h+='</ul>';
  });
  if(!nd&&!np)return null;
  var kw=keys.concat(defs,top).filter(function(t,i,a){
    var lc=a.map(function(x){return x.toLowerCase()}),k=t.toLowerCase();
    return lc.indexOf(k)===i&&!lc.some(function(o){return o!==k&&o.length>k.length&&o.indexOf(k)>-1});
  }).slice(0,15);
  if(kw.length>=3)h+='<h3>Mots-clés</h3><p>'+kw.map(function(t){return '<b>'+esc(cap(t))+'</b>'}).join(' · ')+'</p>';
  return {html:h,defs:nd,points:np};
}
function htmlKeys(html){
  var root=document.createElement('div'),keys=[];root.innerHTML=sanitize(html);
  root.querySelectorAll('b,strong,mark,[style*="bold"],[style*="255, 226, 122"],[style*="ffe27a"]').forEach(function(e){

/* ---------- générateur de QCM (sans IA) ---------- */
var STOP={};'dans pour avec sans cette cette ces ses son leurs leur plus moins entre comme aussi sont être avoir fait faire tout tous toute toutes dont donc ainsi alors mais très peut peuvent permet permettent ceux celui celle quand lorsque chaque après avant pendant depuis selon sous vers chez cela ceci autre autres même mêmes ensuite notamment souvent toujours jamais aussi parce afin lequel laquelle lesquels'.split(' ').forEach(function(w){STOP[w]=1});
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function trail(s){return s.replace(/[\s.;,:]+$/,'')}
function shortTxt(s,max){if(s.length<=max)return s;var c=s.lastIndexOf(' ',max);return s.slice(0,c>40?c:max)+'…'}
function cleanLine(s){return s.replace(/\s+/g,' ').replace(/^[\s•\-–—*]+/,'').replace(/^\d+[.)]\s+/,'').trim()}
function reEsc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function pick3(correct,pool,avoid){
  var seen={},lc=correct.toLowerCase(),av=(avoid||'').toLowerCase(),out=[];
  shuffle(pool).forEach(function(p){
    var k=p.toLowerCase();
    if(k===lc||seen[k]||(av&&av.indexOf(k)>-1))return;
    seen[k]=1;out.push(p);
  });
  return out.length>=3?out.slice(0,3):null;
}

function analyse(html){
  var root=document.createElement('div');root.innerHTML=sanitize(html);
  var keys=[];
  root.querySelectorAll('b,strong,mark,[style*="bold"],[style*="font-weight: 700"],[style*="255, 226, 122"],[style*="ffe27a"]').forEach(function(e){
    var t=cleanLine(e.textContent);t=trail(t);
    if(t.length>=3&&t.length<=50&&keys.map(function(k){return k.toLowerCase()}).indexOf(t.toLowerCase())<0)keys.push(t);
  });
  root.querySelectorAll('p,li,div,h1,h2,h3,h4,h5,h6,br,tr,blockquote').forEach(function(e){e.insertAdjacentText('afterend','\n')});
  var text=(root.textContent||'').replace(/ /g,' ');
  var lines=text.split('\n').map(cleanLine).filter(function(l){return l.length>=8});
  var sentences=[];
  lines.forEach(function(l){
    l.replace(/([.!?])\s+(?=[A-ZÀ-Ý«"])/g,'$1\u0000').split('\u0000').forEach(function(s){s=s.trim();if(s.length>=25&&s.length<=260)sentences.push(s)});
  });
  var defs=[],seenT={};
  var colon=/^([^:：]{2,60}?)\s*[:：]\s+(.{12,})$/;
  var verb=/^(?:l'|l’|le |la |les |un |une )?(.{2,50}?)\s+(?:est|sont|désigne|désignent|correspond à|correspondent à|se définit comme|s'appelle|s’appelle)\s+(.{12,})$/i;
  lines.forEach(function(l){
    var m=l.match(colon),term,def;
    if(m&&m[1].split(' ').length<=8){term=trail(cleanLine(m[1]));def=trail(m[2])}
    else{
      m=l.match(verb);
      if(m&&m[1].split(' ').length<=6&&m[1].indexOf(',')<0){term=trail(cleanLine(m[1]));def=trail(m[2])}
    }
    if(term&&def&&term.length>=2&&!seenT[term.toLowerCase()]){seenT[term.toLowerCase()]=1;defs.push({term:cap(term),def:cap(def),line:l})}
  });
  var terms=[];
  keys.concat(defs.map(function(d){return d.term})).forEach(function(t){if(terms.map(function(x){return x.toLowerCase()}).indexOf(t.toLowerCase())<0)terms.push(t)});
  var words={};
  (text.match(/[\p{L}'’-]{6,}/gu)||[]).forEach(function(w){var k=w.toLowerCase();if(!STOP[k]&&!/^\d/.test(k))words[k]=1});
  return {keys:keys,defs:defs,terms:terms,sentences:sentences,words:Object.keys(words)};
}

function buildQuiz(html,n){
  var A=analyse(html),cands=[];
  var defTexts=A.defs.map(function(d){return shortTxt(d.def,120)});
  A.defs.forEach(function(d,i){
    var dt=defTexts[i],src='d'+i;
    var o1=pick3(dt,defTexts,'');
    if(o1)cands.push({src:src,q:'Qu\'est-ce que « '+d.term+' » ?',correct:dt,wrong:o1,note:'Dans ton cours : '+d.line});
    var o2=pick3(d.term,A.terms,d.def);
    if(o2)cands.push({src:src,q:'Quelle notion correspond à : « '+shortTxt(d.def,140)+' » ?',correct:d.term,wrong:o2,note:'Dans ton cours : '+d.line});
  });
  A.sentences.forEach(function(s,i){
    var lcs=s.toLowerCase(),src='s'+i;
    var found=A.terms.filter(function(t){return t.length>=3&&lcs.indexOf(t.toLowerCase())>-1}).sort(function(a,b){return b.length-a.length});
    var done=false;
    for(var k=0;k<found.length&&!done;k++){
      var t=found[k],re=new RegExp('(^|[^\\p{L}])('+reEsc(t)+')(?![\\p{L}])','iu');
      if(!re.test(s))continue;
      var blanked=s.replace(re,function(_,a){return a+'_____'});
      var o=pick3(t,A.terms,s);
      if(o){cands.push({src:src,q:'Complète la phrase : « '+blanked+' »',correct:t,wrong:o,note:'Phrase d\'origine : '+s});done=true}
    }
    if(!done&&A.words.length>=6){
      var toks=(s.match(/[\p{L}'’-]{7,}/gu)||[]).filter(function(w){return !STOP[w.toLowerCase()]}).sort(function(a,b){return b.length-a.length});
      if(toks.length){
        var w=toks[0],pool=A.words.filter(function(x){return lcs.indexOf(x)<0}).map(function(x){return {x:x,s:Math.abs(x.length-w.length)+Math.random()*3}}).sort(function(a,b){return a.s-b.s}).slice(0,12).map(function(o){return o.x});
        var o3=pick3(w.toLowerCase(),pool,'');
        if(o3){
          var re2=new RegExp('(^|[^\\p{L}])('+reEsc(w)+')(?![\\p{L}])','u');
          cands.push({src:src,q:'Complète la phrase : « '+s.replace(re2,function(_,a){return a+'_____'})+' »',correct:w.toLowerCase(),wrong:o3,note:'Phrase d\'origine : '+s});
        }
      }
    }
  });
  var order=shuffle(cands),chosen=[],usedSrc={},usedQ={};
  order.forEach(function(c){if(chosen.length<n&&!usedSrc[c.src]&&!usedQ[c.q]){usedSrc[c.src]=1;usedQ[c.q]=1;chosen.push(c)}});
  order.forEach(function(c){if(chosen.length<n&&!usedQ[c.q]){usedQ[c.q]=1;chosen.push(c)}});
  var qs=chosen.map(function(c){
    var opts=shuffle([c.correct].concat(c.wrong));
    return {q:c.q,options:opts,answer:opts.indexOf(c.correct),note:c.note};
  });
  return {qs:qs,stats:{defs:A.defs.length,keys:A.keys.length}};
}

function startQuiz(n){

function exportJson(){
  return JSON.stringify({v:1,subjects:S.subjects,docs:S.docs.map(function(d){return Object.assign({},d,{files:[]})})});
}
function importJson(txt){
  var o;try{o=JSON.parse(txt)}catch(e){toast("Ce texte n'est pas une sauvegarde valide.");return}
  if(!o||!Array.isArray(o.subjects)||!Array.isArray(o.docs)){toast("Ce texte n'est pas une sauvegarde valide.");return}
  var ns=0,nd=0;
  o.subjects.forEach(function(s){if(s&&s.id&&s.name&&!getSubject(s.id)){S.subjects.push({id:String(s.id),name:String(s.name).slice(0,40),color:COLORS.indexOf(s.color)>-1?s.color:COLORS[0]});ns++}});
  o.docs.forEach(function(d){if(d&&d.id&&getSubject(d.sid)&&!getDoc(d.id)){S.docs.push({id:String(d.id),sid:d.sid,type:d.type==='cours'?'cours':'fiche',title:String(d.title||'').slice(0,120),html:sanitize(String(d.html||'')),updated:Number(d.updated)||Date.now(),files:[],last:d.last&&typeof d.last.score==='number'?{score:d.last.score,total:d.last.total,date:d.last.date}:null});nd++}});
  save();render();
  toast(ns+' matière'+(ns>1?'s':'')+' et '+nd+' document'+(nd>1?'s':'')+' ajouté'+(nd>1?'s':'')+'.');
}

  if(nav.view==='quiz'&&ui.quiz&&ui.quiz.i<ui.quiz.qs.length&&!/INPUT|TEXTAREA/.test((e.target.tagName||''))){
    var q=ui.quiz;
    if(q.picked===null&&/^[1-4]$/.test(e.key)&&q.qs[q.i].options[+e.key-1]!==undefined){doPick(+e.key-1)}
    else if(q.picked!==null&&(e.key==='Enter'||e.key==='ArrowRight')){e.preventDefault();doNext()}
  }
});

function doPick(i){
  var q=ui.quiz;if(!q||q.picked!==null)return;
  q.picked=i;
  var cur=q.qs[q.i];
  if(i===cur.answer)q.score++;else q.wrong.push(cur);
  render();
}
function doNext(){
  var q=ui.quiz;if(!q||q.picked===null)return;
  q.i++;q.picked=null;
  if(q.i>=q.qs.length)finishQuiz();
  render();try{window.scrollTo(0,0)}catch(e){}
}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-action]');if(!el)return;
  var a=el.getAttribute('data-action'),id=el.getAttribute('data-id');
  switch(a){
    case 'theme':theme=isDark()?'light':'dark';try{localStorage.setItem('classeur-theme',theme)}catch(x){}applyTheme();break;
    case 'home':go('home',{sid:null,docId:null});break;
    case 'focus-add':{var sn=$('#subj-name');if(sn){sn.scrollIntoView({block:'center'});sn.focus()}break}
    case 'open-subject':go('subject',{sid:id,filter:'all',docId:null});break;
    case 'filter':nav.filter=el.getAttribute('data-f');render();break;
    case 'back':go('subject',{docId:null});break;
    case 'new-doc':{
      var t=el.getAttribute('data-type');
      var d={id:uid(),sid:nav.sid,type:t,title:t==='fiche'?'Nouvelle fiche':'Nouveau cours',html:'',updated:Date.now(),files:[],last:null};
      S.docs.push(d);save();go('doc',{docId:d.id});break;
    }
    case 'open-doc':if(id){var dd=getDoc(id);if(dd)go('doc',{docId:id,sid:dd.sid})}break;
    case 'del-subject-ask':ui.confirm='subject';render();break;
    case 'del-subject-yes':{
      var sid=nav.sid;
      S.docs.filter(function(d){return d.sid===sid}).forEach(function(d){d.files.forEach(function(f){fdel(f.id)})});
      S.docs=S.docs.filter(function(d){return d.sid!==sid});
      S.subjects=S.subjects.filter(function(s){return s.id!==sid});
      save();go('home',{sid:null,docId:null});toast('Matière supprimée.');break;
    }
    case 'del-doc-ask':ui.confirm='doc';render();break;
    case 'del-doc-yes':{
      var dl=getDoc(nav.docId);
      if(dl){dl.files.forEach(function(f){fdel(f.id)});S.docs=S.docs.filter(function(d){return d.id!==dl.id});save()}
      go('subject',{docId:null});toast('Document supprimé.');break;
    }
    case 'cancel':ui.confirm=null;render();break;
    case 'to-fiche':{
      var src=getDoc(nav.docId);if(!src)break;
      var g=makeFiche(htmlBlocks(src.html||''),htmlKeys(src.html||''));
      if(g){newFiche(src.sid,src.title,g);break}
      var pf=src.files.filter(function(f){return isPdfMeta(f)&&(!f.read||f.read.words)});
      if(pf.length){genFromPdf(pf[0].id);break}
      toast('Écris ou colle ton cours (ou joins un PDF) avant de générer une fiche.');break;
    }
    case 'cmd':runCmd(el.getAttribute('data-c'));break;
    case 'open-file':openFile(id);break;
    case 'close-viewer':closeViewer();break;
    case 'extract':extractPdf(id);break;
    case 'gen-fiche':genFromPdf(id);break;
    case 'rm-file':{
      var dr=getDoc(nav.docId);if(!dr)break;
      dr.files=dr.files.filter(function(f){return f.id!==id});fdel(id);dr.updated=Date.now();save();closeViewer();refreshFiles();break;
    }
    case 'quiz-setup':{
      var dq=getDoc(id);if(!dq)break;
      var r=buildQuiz(dq.html||'',999);
      ui.avail=r.qs.length;ui.stats=r.stats;go('quizsetup',{docId:id,sid:dq.sid});break;
    }
    case 'start-quiz':startQuiz(parseInt(el.getAttribute('data-n'),10)||5);break;
    case 'pick':doPick(parseInt(el.getAttribute('data-i'),10));break;
    case 'next':doNext();break;
    case 'retry-wrong':{
      var q=ui.quiz;if(!q)break;
      ui.quiz={docId:q.docId,qs:shuffle(q.wrong),i:0,picked:null,score:0,wrong:[],retry:true};go('quiz');break;
    }
    case 'new-quiz':{var qn=ui.quiz;startQuiz(qn&&qn.n?qn.n:10);break}
    case 'copy-export':{
      var box=$('#export-box');if(!box)break;
      box.value=exportJson();
      var fallback=function(){box.focus();box.select();toast('Sélectionné : copie avec Ctrl+C (ou appui long sur mobile).')};
      try{navigator.clipboard.writeText(box.value).then(function(){toast('Sauvegarde copiée.')},fallback)}catch(x){fallback()}
      break;
    }
    case 'import-text':{var ib=$('#import-box');if(ib&&ib.value.trim())importJson(ib.value);else toast('Colle d\'abord une sauvegarde.');break}
  }
});

/* ---------- démarrage ---------- */
/* ---------- profils (LE, LY, SA) ---------- */
var PROFILS=['LE','LY','SA'];
var profil=null;
try{profil=localStorage.getItem('classeur-profil')}catch(e){}
if(PROFILS.indexOf(profil)<0)profil=null;
function cleProfil(p){return LEGACY_KEY+'-'+p}
function majProfilBtn(){
  var d=$('#profil-dot'),n=$('#profil-name');
  if(d)d.textContent=profil?profil.charAt(0):'?';
  if(n)n.textContent=profil||'Profil';
}
function afficherChoix(){
  var h='';
  PROFILS.forEach(function(p){
    h+='<button type="button" class="pcard'+(p===profil?' cur':'')+'" data-action="choisir-profil" data-id="'+p+'"><span class="pbig">'+p+'</span><span>'+p+'</span>'+(p===profil?'<span class="pcap">Profil actuel</span>':'')+'</button>';
  });
  $('#pgrid').innerHTML=h;
  $('#profil-screen').hidden=false;
  var f=document.querySelector('#pgrid .pcard');if(f)f.focus();
}
function ouvrirProfil(p){
  if(PROFILS.indexOf(p)<0)return;
  profil=p;
  try{localStorage.setItem('classeur-profil',p)}catch(e){}
  KEY=cleProfil(p);
  /* données d'avant les profils : reprises une seule fois par le premier profil choisi */
  try{
    if(!localStorage.getItem('classeur-migre')){
      var old=localStorage.getItem(LEGACY_KEY);
      if(old&&!localStorage.getItem(KEY))localStorage.setItem(KEY,old);
      if(old)localStorage.setItem('classeur-migre',p);
    }
  }catch(e){}
  S={subjects:[],docs:[],seeded:false};
  nav={view:'home',sid:null,docId:null,filter:'all'};
  ui.confirm=null;ui.quiz=null;ui.prev=null;ui.q='';ui.avail=0;ui.stats=null;ui.reading={};
  try{closeViewer()}catch(e){}
  var sb=$('#search');if(sb)sb.value='';
  load();seed();majProfilBtn();
  $('#profil-screen').hidden=true;
  render();try{window.scrollTo(0,0)}catch(e){}
}
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-action="choisir-profil"],[data-action="changer-profil"]');if(!el)return;
  if(el.getAttribute('data-action')==='choisir-profil')ouvrirProfil(el.getAttribute('data-id'));
  else afficherChoix();
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&profil&&!$('#profil-screen').hidden)$('#profil-screen').hidden=true;
});

applyTheme();majProfilBtn();
if(profil)ouvrirProfil(profil);else afficherChoix();
})();
</script>
